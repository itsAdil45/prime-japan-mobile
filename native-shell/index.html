<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Prime Japan</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff;
      }
      .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #02ab86;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 28px;
        margin-bottom: 8px;
      }
      .title {
        font-size: 17px;
        font-weight: 600;
        color: #27272a;
      }
      .subtitle {
        font-size: 14px;
        color: #71717a;
        max-width: 280px;
      }
      .retry-btn {
        margin-top: 8px;
        padding: 10px 28px;
        border: none;
        border-radius: 999px;
        background: #02ab86;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .retry-btn:disabled {
        opacity: 0.6;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e4e4e7;
        border-top-color: #02ab86;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="screen" id="loading-screen">
      <div class="logo">PJ</div>
      <div class="spinner"></div>
      <div class="title">Loading Prime Japan…</div>
    </div>

    <div class="screen hidden" id="offline-screen">
      <div class="logo">PJ</div>
      <div class="title">No Internet Connection</div>
      <div class="subtitle">
        Prime Japan needs an internet connection to load. Please check your
        connection and try again.
      </div>
      <button class="retry-btn" id="retry-btn">Retry</button>
    </div>

    <script>
      var APP_URL = "https://prime-japan-mobile.vercel.app/home";
      var loadingScreen = document.getElementById("loading-screen");
      var offlineScreen = document.getElementById("offline-screen");
      var retryBtn = document.getElementById("retry-btn");

      function showOffline() {
        loadingScreen.classList.add("hidden");
        offlineScreen.classList.remove("hidden");
      }
      function showLoading() {
        offlineScreen.classList.add("hidden");
        loadingScreen.classList.remove("hidden");
      }
      function goToApp() {
        window.location.href = APP_URL;
      }

      function checkAndProceed() {
        var Network =
          window.Capacitor &&
          window.Capacitor.Plugins &&
          window.Capacitor.Plugins.Network;
        if (!Network) {
          // Plain-browser fallback (no Capacitor bridge present)
          navigator.onLine ? goToApp() : showOffline();
          return;
        }
        Network.getStatus()
          .then(function (status) {
            status.connected ? goToApp() : showOffline();
          })
          .catch(showOffline);
      }

      retryBtn.addEventListener("click", function () {
        retryBtn.disabled = true;
        retryBtn.textContent = "Checking…";
        showLoading();
        setTimeout(function () {
          retryBtn.disabled = false;
          retryBtn.textContent = "Retry";
          checkAndProceed();
        }, 500);
      });

      document.addEventListener("DOMContentLoaded", function () {
        checkAndProceed();
        var Network =
          window.Capacitor &&
          window.Capacitor.Plugins &&
          window.Capacitor.Plugins.Network;
        if (Network && Network.addListener) {
          Network.addListener("networkStatusChange", function (status) {
            if (status.connected) goToApp();
          });
        }
      });
    </script>
  </body>
</html>
